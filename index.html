<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yaerilim.com</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #ffd1dc;
      display: grid;
      place-items: center;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: #7a2e4a;
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); font-weight: 600; white-space: pre; }
    .cursor {
      display: inline-block;
      width: 0.08em;
      height: 1em;
      margin-left: 0.08em;
      background: currentColor;
      vertical-align: -0.12em;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    main { display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .social {
      display: flex;
      gap: 22px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .social.show { opacity: 1; transform: none; }
    .social a {
      color: #7a2e4a;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .social a:hover, .social a:focus-visible { color: #ff5c8a; transform: translateY(-3px); }
    .social a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .social svg { width: 30px; height: 30px; }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="hello world"><span id="text"></span><span class="cursor" aria-hidden="true"></span></h1>

    <nav class="social" id="social" aria-label="Social links">
      <a href="https://www.instagram.com/yaerilim" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>
        </svg>
      </a>
      <a href="https://www.linkedin.com/in/yaerilim/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <line x1="8" y1="10.5" x2="8" y2="16.5"/>
          <circle cx="8" cy="7.5" r="0.6" fill="currentColor"/>
          <path d="M12 16.5v-6M12 13a2.5 2.5 0 0 1 5 0v3.5"/>
        </svg>
      </a>
    </nav>
  </main>

  <script>
    const message = "hello world";
    const el = document.getElementById("text");
    let i = 0;
    function type() {
      el.textContent = message.slice(0, ++i);
      if (i < message.length) setTimeout(type, 110 + Math.random() * 120);
      else setTimeout(() => document.getElementById("social").classList.add("show"), 300);
    }
    setTimeout(type, 600);
  </script>
</body>
</html>
